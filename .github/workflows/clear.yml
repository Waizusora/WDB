name: Clear Workflow Runs
on:
  workflow_dispatch: # Run Manually Actions
  schedule:
    - cron: '0 0 * * 0' # Schedule 

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 6
          
